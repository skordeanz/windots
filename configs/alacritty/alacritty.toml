# Winmarchy Alacritty configuration, written when Omarchy mode is entered and
# removed again on the way back to Windows 11. Do not edit by hand; it is
# regenerated on every theme change.
#
# The colour mapping is ported verbatim from Omarchy's own
# default/themed/alacritty.toml.tpl (see ref/omarchy). Omarchy derives
# selection_background from selection and selection_foreground from
# bright_foreground, so those two are substituted directly here.

[window]
padding = { x = 10, y = 10 }
decorations = "none"
opacity = 1.0
dynamic_title = true

[terminal.shell]
program = "powershell"
args = ["-NoLogo"]

[font]
size = 11
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }

[colors.primary]
background = "#1e1e2e"
foreground = "#cdd6f4"

[colors.cursor]
text = "#1e1e2e"
cursor = "#cdd6f4"

[colors.vi_mode_cursor]
text = "#1e1e2e"
cursor = "#cdd6f4"

[colors.search.matches]
foreground = "#1e1e2e"
background = "#f9e2af"

[colors.search.focused_match]
foreground = "#1e1e2e"
background = "#f38ba8"

[colors.footer_bar]
foreground = "#1e1e2e"
background = "#cdd6f4"

[colors.selection]
text = "#cdd6f4"
background = "#45475a"

[colors.normal]
black = "#1e1e2e"
red = "#f38ba8"
green = "#a6e3a1"
yellow = "#f9e2af"
blue = "#89b4fa"
magenta = "#f5c2e7"
cyan = "#94e2d5"
white = "#cdd6f4"

[colors.bright]
black = "#585b70"
red = "#f38ba8"
green = "#a6e3a1"
yellow = "#f9e2af"
blue = "#89b4fa"
magenta = "#f5c2e7"
cyan = "#94e2d5"
white = "#cdd6f4"
